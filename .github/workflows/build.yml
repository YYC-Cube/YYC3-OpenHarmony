# YYC³ OpenHarmony: self-hosted HAP build entry point.
#
# Dual-target dispatch:
#   - openharmony: OpenHarmony runtime, SDK API 20 (verified on this runner)
#   - harmonyos:   HarmonyOS NEXT runtime, SDK 5.1.0(18) (requires HarmonyOS SDK
#                  components + repository variable ENABLE_HARMONYOS_TARGET=true)
#
# The actual build steps live in build-hap.yml (reusable workflow).
# The runner must register the labels `self-hosted` and `ohos`, and provide:
#   - JDK 17
#   - OpenHarmony SDK API 20 with DEVECO_SDK_HOME (and optionally
#     OHOS_BASE_SDK_HOME) exported
#   - command-line-tools 5.1 (ohpm, hvigor, node, npm on PATH)
#   - hdc on PATH
# Note: on Windows the node/npm directory on PATH must come from an intact
# Node.js installation; a `npm.cmd` shim that redirects to pnpm breaks both
# `hvigorw` and the Flutter tool's hvigor plugin install.
# Optional repository variables:
#   PUB_HOSTED_URL, FLUTTER_STORAGE_BASE_URL, FRAMEWORK_VERSION,
#   OPENHARMONY_API, ENABLE_HARMONYOS_TARGET

name: Build HAP

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: Target platform profile
        type: choice
        options:
          - both
          - openharmony
          - harmonyos
        default: both
      build_mode:
        description: Build mode
        type: choice
        options:
          - release
          - profile
          - debug
        default: release
      target_platform:
        description: Target platform
        type: choice
        options:
          - ohos-arm64
          - ohos-x64
        default: ohos-arm64
      sample_project:
        description: Sample project path in this repository
        type: string
        default: examples/hello_world
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-openharmony:
    name: Build OpenHarmony HAP
    if: ${{ (inputs.target_os || 'both') != 'harmonyos' }}
    uses: ./.github/workflows/build-hap.yml
    with:
      target_os: openharmony
      build_mode: ${{ inputs.build_mode || 'release' }}
      target_platform: ${{ inputs.target_platform || 'ohos-arm64' }}
      sample_project: ${{ inputs.sample_project || 'examples/hello_world' }}

  build-harmonyos:
    name: Build HarmonyOS NEXT HAP
    if: ${{ (inputs.target_os || 'both') != 'openharmony' && vars.ENABLE_HARMONYOS_TARGET == 'true' }}
    uses: ./.github/workflows/build-hap.yml
    with:
      target_os: harmonyos
      build_mode: ${{ inputs.build_mode || 'release' }}
      target_platform: ${{ inputs.target_platform || 'ohos-arm64' }}
      sample_project: ${{ inputs.sample_project || 'examples/hello_world' }}

  harmonyos-notice:
    name: HarmonyOS NEXT leg status
    if: ${{ (inputs.target_os || 'both') != 'openharmony' && vars.ENABLE_HARMONYOS_TARGET != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped HarmonyOS NEXT leg
        run: |
          echo "::warning::HarmonyOS NEXT leg was skipped: install the HarmonyOS SDK (5.1.0 / API 18) with DevEco Studio SDK Manager, then set the repository variable ENABLE_HARMONYOS_TARGET=true and re-run."
